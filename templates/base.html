{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPI Fraud Detection</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="{% static 'css/fraud_ui.css' %}"><style>.public-nav{height:64px;background:#fff;border-bottom:1px solid #e1e8f0;display:flex;align-items:center;padding:0 6%;justify-content:space-between}.public-nav .brand{border:0;margin:0;padding:0}.public-nav .brand strong{color:#0a2948}.public-links{display:flex;gap:24px}.public-links a{font-size:12px;color:#3f5064;font-weight:600}.public-links a:hover{color:#0d55c9}.public-main{min-height:calc(100vh - 64px)}.auth-shell{min-height:calc(100vh - 64px);display:flex;background:#f5f8fc}.auth-left{width:50%;background:linear-gradient(145deg,#041b36,#0a3970);color:#fff;display:flex;align-items:center;justify-content:center;padding:50px}.auth-art{text-align:center;max-width:500px}.upi-mark{font-size:70px;font-weight:800;font-style:italic;letter-spacing:-5px}.auth-art h1{font-size:30px;margin:5px 0 12px}.auth-art p{font-size:13px;color:#cbdced}.shield{font-size:90px;margin:25px 0;color:#dbeeff}.auth-right{width:50%;display:flex;align-items:center;justify-content:center;padding:35px}.auth-card{background:#fff;width:100%;max-width:420px;border-radius:12px;padding:34px;box-shadow:0 12px 35px rgba(30,55,90,.12)}.auth-card h2{margin:0;text-align:center;color:#14253a;font-size:22px}.auth-card .sub{text-align:center;color:#7b8796;font-size:11px;margin:7px 0 22px}.auth-input{width:100%;padding:12px;border:1px solid #dfe6ee;border-radius:6px;margin-bottom:13px;font-size:12px}.auth-btn{width:100%;padding:12px;border:0;border-radius:6px;background:#082d59;color:#fff;font-weight:700;cursor:pointer}.auth-help{display:flex;justify-content:space-between;margin:12px 0 20px;font-size:10px;color:#657386}.message{font-size:11px;margin-top:10px;color:#d34b43}@media(max-width:800px){.auth-left{display:none}.auth-right{width:100%}}
</style></head><body><nav class="public-nav"><a href="{% url 'index' %}" style="display:flex;align-items:center;gap:10px"><div class="brand-icon" style="background:#092c52;color:#fff"><i class="fa-solid fa-shield-halved"></i></div><div><strong>UPI Fraud Detection System</strong></div></a><div class="public-links"><a href="{% url 'index' %}">Home</a><a href="{% url 'UserLogin' %}">User Login</a><a href="{% url 'AdminLogin' %}">Admin</a><a href="{% url 'UserRegister' %}">Register</a></div></nav><main class="public-main">{% block contents %}{% endblock %}</main>{% block extra_scripts %}{% endblock %}</body></html>

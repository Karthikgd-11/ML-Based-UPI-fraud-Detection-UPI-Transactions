{% extends 'base.html' %}{% block contents %}<div class="auth-shell"><div class="auth-left"><div class="auth-art"><i class="fa-solid fa-user-shield" style="font-size:110px"></i><h1>Administrator Portal</h1><p>Manage users and monitor the fraud detection system.</p></div></div><div class="auth-right"><div class="auth-card"><h2>Admin Login</h2><div class="sub">Authorized administrators only</div><form action="{% url 'AdminLoginCheck' %}" method="POST">{% csrf_token %}<input class="auth-input" type="text" name="loginid" required placeholder="Admin Login ID"><input class="auth-input" type="password" name="pswd" required placeholder="Password"><button class="auth-btn" type="submit">Login</button>{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}</form></div></div></div>{% endblock %}
